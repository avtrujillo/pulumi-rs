[package]
name = "pulumi-macros"
version = "0.1.0"
edition = "2024"
description = "Derive macros for the Pulumi Rust SDK"
license = "Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
trybuild = "1"
pulumi-core = { path = "../pulumi-core" }
serde = { version = "1", features = ["derive"] }
