[package]
name = "pulumi-engine"
version = "0.1.0"
edition = "2024"
description = "Rust-native Pulumi engine — runs ResourceMonitor and Engine gRPC services"
license = "Apache-2.0"
repository = "https://github.com/avtrujillo/pulumi-rs"

[dependencies]
pulumi-core = { path = "../pulumi-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = "0.1"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
hmac = "0.12"

[dev-dependencies]
tempfile = "3"

[lib]
doctest = false
