[package]
name = "pulumi-automation"
version = "0.1.0"
edition = "2024"
description = "Automation API for Pulumi — drive stack operations programmatically without the CLI"
license = "Apache-2.0"

[features]
native-engine = ["dep:pulumi-engine"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util"] }
pulumi-engine = { path = "../pulumi-engine", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[lib]
doctest = false
