[package]
name = "pulumi-core"
version = "0.1.0"
edition = "2024"
description = "Pulumi SDK for Rust — define cloud infrastructure as Rust code"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio-stream = "0.1"

[lib]
doctest = false

[build-dependencies]
tonic-build = "0.12"
